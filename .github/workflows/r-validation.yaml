name: R validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2
      - name: Run code-quality gate
        run: Rscript scripts/quality_gate.R
      - name: Run unit tests
        run: Rscript tests/testthat.R
      - name: Run bundled-data end-to-end test
        run: Rscript test_all.R
      - name: Enforce core coverage
        run: Rscript scripts/coverage_gate.R
      - name: Run structural validation
        run: Rscript master_launcher.R validate
      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: validation-evidence
          path: artifacts/
