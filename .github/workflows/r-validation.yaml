name: R validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.1"
          use-public-rspm: true
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libglpk-dev libpoppler-cpp-dev
      - uses: r-lib/actions/setup-renv@v2
      - name: Run code-quality gate
        run: Rscript scripts/quality_gate.R
      - name: Run unit tests
        run: Rscript tests/testthat.R
      - name: Run bundled-data end-to-end test
        run: Rscript test_all.R
      - name: Enforce core coverage
        run: Rscript scripts/coverage_gate.R
      - name: Run structural validation
        run: Rscript master_launcher.R validate
      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: validation-evidence-${{ runner.os }}
          path: artifacts/
