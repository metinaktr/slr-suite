name: R validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat
      - name: Run unit tests
        run: Rscript tests/testthat.R
      - name: Run structural validation
        run: Rscript master_launcher.R validate
      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: validation-evidence
          path: artifacts/validation/
