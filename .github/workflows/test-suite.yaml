name: Test SLR-Suite R Scripts

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-r-scripts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c(
            "bibliometrix",
            "dplyr",
            "stringr",
            "tidyr",
            "readr",
            "ggplot2",
            "stringi",
            "tibble"
          ), repos = "https://cloud.r-project.org")'

      - name: Run R analysis scripts only
        run: |
          Rscript scripts/01_acquire_and_dedupe.R
          Rscript scripts/02_screening.R
          Rscript scripts/03_biblio_analysis.R
          Rscript scripts/04_vosviewer_export.R
          Rscript scripts/05_tccm_matrix.R
          Rscript scripts/06_thematic_evolution.R
          Rscript scripts/07_citation_impact.R
          Rscript scripts/08_future_agenda_SPAR.R
