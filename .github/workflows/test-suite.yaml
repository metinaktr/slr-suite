name: Test SLR-Suite Pipeline (Node 24 Ready)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup R (cached, Node 24)
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Cache R Packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-${{ hashFiles('**/DESCRIPTION') }}
          restore-keys: |
            ${{ runner.os }}-r-

      - name: Install R Packages
        run: |
          Rscript -e 'install.packages(c(
            "bibliometrix",
            "dplyr",
            "stringr",
            "tidyr",
            "readr",
            "ggplot2",
            "stringi",
            "tibble"
          ), repos = "https://cloud.r-project.org")'

      - name: Run SLR-Suite Scripts
        run: |
          Rscript scripts/01_acquire_and_dedupe.R
          Rscript scripts/02_screening.R
          Rscript scripts/03_biblio_analysis.R
          Rscript scripts/04_vosviewer_export.R
          Rscript scripts/05_tccm_matrix.R
          Rscript scripts/06_thematic_evolution.R
          Rscript scripts/07_citation_impact.R
          Rscript scripts/08_future_agenda_SPAR.R

      - name: Upload Outputs
        uses: actions/upload-artifact@v4
        with:
          name: slr-suite-results
          path: data/processed/
``
