name: Test SLR-Suite Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install System Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libxml2-dev libcurl4-openssl-dev libssl-dev

      - name: Install R Packages
        run: |
          Rscript -e 'install.packages(c(
            "bibliometrix",
            "dplyr",
            "stringr",
            "tidyr",
            "readr",
            "ggplot2",
            "stringi",
            "tibble"
          ), repos = "https://cloud.r-project.org")'

      - name: Run Scripts (01 → 08)
        run: |
          Rscript scripts/01_acquire_and_dedupe.R
          Rscript scripts/02_screening.R
          Rscript scripts/03_biblio_analysis.R
          Rscript scripts/04_vosviewer_export.R
          Rscript scripts/05_tccm_matrix.R
          Rscript scripts/06_thematic_evolution.R
          Rscript scripts/07_citation_impact.R
          Rscript scripts/08_future_agenda_SPAR.R

      - name: Upload Pipeline Outputs
        uses: actions/upload-artifact@v4
        with:
          name: slr-pipeline-outputs
          path: data/processed/
