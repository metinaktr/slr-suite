name: pages build and deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read        # ✅ ZORUNLU
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Render Quarto website
      - name: Render Quarto website
        run: quarto render docs/paper

      # 🔎 KRİTİK KONTROL (debug + güvenlik)
      - name: Verify _site output
        run: |
          ls -la docs/paper
          ls -la docs/paper/_site
          test -f docs/paper/_site/index.html

      # Upload generated site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/paper/_site

      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
